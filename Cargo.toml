[package]
name = "rust-graph"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"
description = "A code knowledge graph for 40+ languages. Rust std only, no parser libraries."

[workspace]
members = [
    "crates/deep-abi", "crates/rust-graph-deep", "crates/deep-grammars", "crates/deep-lex", "crates/deep-tables", "crates/deep-rt", "crates/deep-bench"]

[features]
deep = ["dep:deep-rt", "dep:deep-lex", "dep:deep-grammars"]
parser = ["dep:rust-graph-deep"]
# The bridge in src/deep_integration.rs, and nothing in the default build.
deep = ["parser"]

[[bin]]
name = "rust-graph"
path = "src/main.rs"

[[bin]]
name = "rust-graph-deep-scan"
path = "src/bin/rust-graph-deep-scan.rs"
required-features = ["parser"]

# The benchmark harness: corpus verification, the alternating 2x comparison and
# peak RSS. Its code and tests live in crates/deep-bench.
[[bin]]
name = "rust-graph-deep-bench"
path = "crates/deep-bench/src/main.rs"

[[test]]
name = "parser_gate"
path = "tests/parser_gate.rs"
required-features = ["parser"]

[dependencies]
rust-graph-deep = { path = "crates/rust-graph-deep", optional = true }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[[bin]]
name = "rust-graph-deep-bench"
path = "crates/deep-bench/src/main.rs"
