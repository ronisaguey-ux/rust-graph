[package]
name = "rust-graph"
version = "0.2.2"
edition = "2021"
license = "AGPL-3.0-only"
description = "A code knowledge graph for 40+ languages. Rust std only, no parser libraries."

[workspace]
members = [
    "crates/deep-abi", "crates/rust-graph-deep", "crates/deep-grammars", "crates/deep-lex", "crates/deep-tables", "crates/deep-rt", "crates/deep-bench", "crates/deep-conformance", "crates/deep-fuzz"]

[features]
# owner: gideon | removal: never (the CST path is the product, not a phase)
deep = ["dep:deep-rt", "dep:deep-lex", "dep:deep-grammars"]
# owner: gideon | removal: never (the bridge in src/deep_integration.rs; a build
# without it is the lexer-only build, which stays supported)
parser = ["dep:rust-graph-deep"]

[[bin]]
name = "rust-graph"
path = "src/main.rs"

[[bin]]
name = "rust-graph-deep-scan"
path = "src/bin/rust-graph-deep-scan.rs"
required-features = ["parser"]

# The benchmark harness: corpus verification, the alternating 2x comparison and
# peak RSS. Its code and tests live in crates/deep-bench.
[[bin]]
name = "rust-graph-deep-bench"
path = "crates/deep-bench/src/main.rs"

[[test]]
name = "parser_gate"
path = "tests/parser_gate.rs"
required-features = ["parser"]

[dependencies]
rust-graph-deep = { path = "crates/rust-graph-deep", optional = true }
deep-abi = { path = "crates/deep-abi" }
deep-rt = { path = "crates/deep-rt", optional = true }
deep-lex = { path = "crates/deep-lex", optional = true }
deep-grammars = { path = "crates/deep-grammars", optional = true }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

