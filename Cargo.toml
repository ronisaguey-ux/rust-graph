[package]
name = "rust-graph"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"
description = "A code knowledge graph for 40+ languages. Rust std only, no parser libraries."

[workspace]
members = [
    "crates/deep-abi", "crates/rust-graph-deep", "crates/deep-grammars", "crates/deep-lex"]

[features]
parser = ["dep:rust-graph-deep"]

[[bin]]
name = "rust-graph"
path = "src/main.rs"

[[bin]]
name = "rust-graph-deep-scan"
path = "src/bin/rust-graph-deep-scan.rs"
required-features = ["parser"]

[[test]]
name = "parser_gate"
path = "tests/parser_gate.rs"
required-features = ["parser"]

[dependencies]
rust-graph-deep = { path = "crates/rust-graph-deep", optional = true }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
