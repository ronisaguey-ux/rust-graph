[package]
name = "deep-rt"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"
description = "The LR/GLR driver, the flat CST arena and error recovery for the deep scan. std only."

[dependencies]
deep-abi = { path = "../deep-abi" }

[dev-dependencies]
# The parity test compiles the shipped grammars against this runtime and compares
# the result with the runtime they were written on, which must be byte-identical.
deep-grammars = { path = "../deep-grammars" }
rust-graph-deep = { path = "../rust-graph-deep" }
