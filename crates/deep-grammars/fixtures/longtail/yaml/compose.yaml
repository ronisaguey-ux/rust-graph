version: "3.9"

services:
  api:
    build: .
    ports:
      - 8080:8080
    depends_on:
      - db
      - cache
    command: ["run", "--verbose"]
  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: scanner
  cache:
    image: redis:7
volumes:
  pgdata: null
