[package]
name = "deep-lex"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"
description = "A context-sensitive, zero-copy lexer for the deep parser: byte offsets, mode stacks, Python layout, bracket pairs and external scanners. std only."

[dependencies]
deep-abi = { path = "../deep-abi" }

# The runtime is a dev-dependency only: the lexer must not depend on the parser,
# and this is how the end-to-end test proves `deep_abi::Lexer` is enough.
[dev-dependencies]
deep-rt = { path = "../deep-rt" }
